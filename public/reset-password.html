<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuova Password — KnitTranslate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #334155; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 1.25rem 2rem; }
    header a { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    header h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; color: white; letter-spacing: -0.03em; }
    .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card { background: white; border-radius: 1.25rem; padding: 2rem; max-width: 420px; width: 100%; box-shadow: 0 25px 60px rgb(0 0 0 / 0.1); }
    .card h2 { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem; text-align: center; }
    .card p { font-size: 0.85rem; color: #64748b; text-align: center; margin-bottom: 1.5rem; }
    input { width: 100%; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; font-size: 0.9rem; margin-bottom: 0.75rem; outline: none; font-family: inherit; transition: border-color 0.2s; }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    input:disabled { background: #f1f5f9; cursor: not-allowed; }
    button { width: 100%; padding: 0.875rem; border-radius: 0.875rem; background: #4f46e5; color: white; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .message { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.82rem; text-align: center; display: none; }
    .message.success { background: #edf4ed; color: #2d6a2d; border: 1px solid #b8d4b8; }
    .message.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .message.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .back { display: block; text-align: center; margin-top: 1.25rem; font-size: 0.8rem; color: #6366f1; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <a href="/">
      <span style="font-size:1.75rem">🧶</span>
      <h1>KnitTranslate</h1>
    </a>
  </header>

  <div class="container">
    <div class="card">
      <div style="text-align:center; margin-bottom:1rem; font-size:2rem">🔒</div>
      <h2>Nuova Password</h2>
      <p>Scegli una nuova password per il tuo account.</p>

      <input type="password" id="password" placeholder="Nuova password (min. 6 caratteri)" disabled />
      <input type="password" id="confirm" placeholder="Conferma nuova password" disabled />
      <button id="btn" onclick="updatePassword()" disabled>Verifica in corso...</button>

      <div class="message" id="message"></div>
      <a href="/" class="back">← Torna a KnitTranslate</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gbzffkvykduijhyktilq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MRC7rcElhyP4VjeDAIXR3Q_67SFeV5u';

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
      el.style.display = 'block';
    }

    function enableForm() {
      document.getElementById('password').disabled = false;
      document.getElementById('confirm').disabled = false;
      const btn = document.getElementById('btn');
      btn.disabled = false;
      btn.textContent = 'Aggiorna password';
    }

    // Legge token_hash dall'URL e verifica il codice di recovery
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get('token_hash');
      const type = params.get('type') || 'recovery';

      if (!tokenHash) {
        showMessage('Link non valido. Richiedi un nuovo link di reset dalla home.', 'error');
        return;
      }

      const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type });

      if (error) {
        showMessage('Link scaduto o già utilizzato. Richiedi un nuovo link di reset dalla home.', 'error');
      } else {
        // Sessione stabilita: abilita il form
        enableForm();
      }
    })();

    async function updatePassword() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const btn = document.getElementById('btn');

      if (password.length < 6) { showMessage('La password deve essere di almeno 6 caratteri.', 'error'); return; }
      if (password !== confirm) { showMessage('Le password non coincidono.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = '...';

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        showMessage('Errore: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Aggiorna password';
      } else {
        showMessage('✓ Password aggiornata con successo! Verrai reindirizzato...', 'success');
        await client.auth.signOut();
        setTimeout(() => { window.location.href = '/'; }, 2500);
      }
    }
  </script>
</body>
</html>
