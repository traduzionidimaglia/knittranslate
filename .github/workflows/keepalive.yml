name: Supabase keepalive

# Tiene attivo il progetto Supabase (piano Free) con una query leggera ogni giorno,
# così non va in pausa per inattività.
on:
  schedule:
    - cron: "0 7 * * *"   # ogni giorno alle 07:00 UTC
  workflow_dispatch:       # permette di lanciarlo a mano per provarlo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query leggera a Supabase
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/user_translations?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"